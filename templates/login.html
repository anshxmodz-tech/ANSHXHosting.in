<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ANSH HOSTING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .glow-effect {
            box-shadow: 0 0 25px -5px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body class="bg-[#070910] min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- ব্যাকগ্রাউন্ড সাইবার গ্লো ইফেক্ট -->
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="bg-[#0f111a] rounded-2xl p-8 w-full max-w-md border border-blue-500/20 shadow-2xl glow-effect relative z-10 backdrop-blur-md">
        
        <!-- ব্র্যান্ডিং লোগো ও হেডার -->
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/20 group transition duration-300 transform hover:rotate-6">
                <i class="fas fa-server text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-black tracking-wider text-white">ANSH <span class="text-blue-500">HOSTING</span></h1>
            <p class="text-gray-400 text-xs uppercase tracking-widest mt-1.5 font-semibold">Premium Next-Gen Solution</p>
        </div>
        
        <!-- এরর মেসেজ বক্স -->
        {% if error %}
        <div class="bg-red-500/10 border border-red-500/50 rounded-xl p-3.5 mb-5 text-red-400 text-sm text-center flex items-center justify-center gap-2">
            <i class="fas fa-skull-crossbones animate-bounce"></i> 
            <span>{{ error }}</span>
        </div>
        {% endif %}
        
        <!-- লগইন ফর্ম -->
        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-gray-400 text-xs font-bold uppercase tracking-wider mb-2">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                        <i class="fas fa-user-shield"></i>
                    </span>
                    <input type="text" name="username" placeholder="Enter username" required 
                        class="w-full bg-[#08090f] border border-gray-800/80 rounded-xl pl-10 pr-4 py-3.5 text-white placeholder-gray-600 focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 focus:outline-none transition-all duration-200">
                </div>
            </div>
            
            <div>
                <label class="block text-gray-400 text-xs font-bold uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" name="password" placeholder="••••••••" required
                        class="w-full bg-[#08090f] border border-gray-800/80 rounded-xl pl-10 pr-4 py-3.5 text-white placeholder-gray-600 focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 focus:outline-none transition-all duration-200">
                </div>
            </div>
            
            <button type="submit" 
                class="w-full mt-2 bg-gradient-to-r from-blue-600 via-blue-500 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3.5 rounded-xl transition duration-300 transform hover:-translate-y-0.5 shadow-lg shadow-blue-600/20 active:translate-y-0">
                <i class="fas fa-sign-in-alt mr-2"></i> Access Panel
            </button>
        </form>
        
        <!-- ফুটার ও টেলিগ্রাম ক্রেডিট -->
        <div class="mt-8 pt-5 border-t border-gray-900 flex flex-col items-center gap-2">
            <p class="text-gray-500 text-xs font-medium flex items-center gap-1.5">
                <i class="fas fa-shield-cat text-blue-500"></i> Secure System Active
            </p>
            <a href="https://t.me/anshxmodzyt" target="_blank" 
               class="text-xs text-gray-400 hover:text-blue-400 transition-colors flex items-center gap-1 bg-[#08090f] px-3 py-1.5 rounded-full border border-gray-800/60 mt-1">
                <i class="fab fa-telegram text-blue-400"></i> Dev: @Anshxconfig
            </a>
        </div>
    </div>
</body>
</html>
